name: brain-tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-brain.txt
      - run: pip install -r requirements-brain.txt
      - name: Offline tests (no network, no API keys)
        run: python -m pytest tests/brain -q
